<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח תחקור OSINT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      margin: 0;
      padding: 40px 16px;
    }
    .box {
      max-width: 720px;
      margin: 0 auto;
      background: #1f2937;
      padding: 24px;
      border-radius: 12px;
    }
    input {
      width: 72%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .card {
      background: #111827;
      padding: 14px;
      border-radius: 8px;
      margin-top: 16px;
      border-right: 4px solid #3b82f6;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>בדיקת מידע גלוי (OSINT)</h2>
    <p>הזן שם משתמש ב-GitHub, דומיין, כתובת IP או מספר טלפון:</p>
    <input id="queryInput" type="text" placeholder="לדוגמה: octocat, example.com, 8.8.8.8 או +972501234567" />
    <button id="runBtn">בדוק</button>
    <div id="output"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
